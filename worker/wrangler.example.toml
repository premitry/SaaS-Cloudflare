name = "cfp-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "cfp_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Static dashboard. Built by `npm run build:web` -> ../web/dist
[assets]
directory = "../web/dist"
binding = "ASSETS"

[vars]
ALLOWED_ORIGINS = "*"

# IMPORTANT: do NOT put JWT_SECRET here for production.
#   Local dev:    `worker/.dev.vars`  (auto-created by `npm run setup`)
#   Production:   `npx wrangler secret put JWT_SECRET`
