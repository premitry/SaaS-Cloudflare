name = "cfp-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "cfp_db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Variables
[vars]
# CORS allowlist:
#   "*"  - allow any origin (default for local dev so localhost & 127.0.0.1 both work)
#   "https://your-frontend.com,https://other.com"  - pin to exact origins for production
#
# `npm run deploy:setup` will rewrite this with your real frontend URL.
ALLOWED_ORIGINS = "*"

# IMPORTANT: do NOT put JWT_SECRET here for production.
# - Local dev: store it in worker/.dev.vars (created by `npm run setup`).
# - Production: `npx wrangler secret put JWT_SECRET` (done by `npm run deploy:setup`).
